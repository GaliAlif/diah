<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff1f7">
  <title>A Little Flower for You ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <main class="page">
    <h1>For my <span>Lestasi</span> ♡</h1>
    <p class="intro">Makan nih, biar ga sariawan.</p>

    <section class="flower-card" aria-label="Bunga mawar dari tulisan love u">
      <canvas id="flowerCanvas" aria-label="Animasi bunga mawar yang tersusun dari tulisan love u"></canvas>
      <button class="bloom-button" id="bloomButton" type="button">Coba pencet <span>♡</span></button>
    </section>

    <section class="message">
      <div class="tiny-heart">♡</div>
      <p class="message-line"></p>
      <p class="message-main">i love u, i love u, i love u <span>moreee</span></p>
      <p class="signature"></p>
    </section>
  </main>
  <div id="burstLayer" aria-hidden="true"></div>
  <script src="script.js"></script>
</body>
</html>
